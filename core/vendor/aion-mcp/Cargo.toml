[package]
name = "aion-mcp"
description = "MCP (Model Context Protocol) client implementation for aionrs"
version = "0.2.11"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iOfficeAI/aionrs"

[dependencies]
aion-types = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-protocol = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-tools = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-config = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }

tracing = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"

[features]
test-utils = []
