[package]
name = "aion-providers"
description = "LLM provider implementations for aionrs (Anthropic, OpenAI, Bedrock, Vertex)"
version = "0.2.11"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iOfficeAI/aionrs"

[dependencies]
aion-types = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-config = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }

tokio   = { version = "1", features = ["full"] }
futures = "0.3"
http = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow    = "1"
dirs = "6"
url = "2"
base64 = "0.22"
jsonwebtoken = "10"
chrono = { version = "0.4", features = ["serde"] }

aws-sigv4            = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-config           = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts          = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "sigv4a"] }

tracing = "0.1"
workspace-hack = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }

[dev-dependencies]
wiremock    = "0.6"
tokio-test  = "=0.4.5"
insta       = { version = "=1.48.0", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
