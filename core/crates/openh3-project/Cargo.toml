[package]
name = "openh3-project"
version.workspace = true
edition.workspace = true


[lib]
name = "openh3_project"

[dependencies]
openh3-api-types.workspace = true
openh3-auth.workspace = true
openh3-common.workspace = true
openh3-db.workspace = true
axum.workspace = true
url.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true
# Runtime link (Project Explorer fs runtime): async provider IO + non-recursive watch.
tokio.workspace = true
async-trait.workspace = true
notify.workspace = true
# Filename search: in-process tree walk honoring .gitignore/excludes (same walker
# ripgrep is built on) — no ripgrep subprocess, since filename search reads no content.
ignore.workspace = true
# Source control: in-process git (no external binary, headless/cross-platform),
# plus platform trash for discarding untracked files non-destructively.
git2.workspace = true
trash.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tower.workspace = true
http-body-util.workspace = true
