[package]
name = "openh3-sidebar"
version.workspace = true
edition.workspace = true


[lib]
name = "openh3_sidebar"

[dependencies]
openh3-api-types.workspace = true
openh3-auth.workspace = true
openh3-common.workspace = true
openh3-db.workspace = true
# Read-model reuse: row_to_response_with_extra (hydration) + is_temp_session_workspace
# (temp-path classification, same predicate the write side uses).
openh3-conversation.workspace = true
# Lexical path canonicalization for the read-side path-merge match (no fs).
openh3-project.workspace = true
axum.workspace = true
base64.workspace = true
# Repeated `win` query params + percent-decoded cursors: parse the raw query with
# form_urlencoded (serde_urlencoded / axum Query collapses duplicate keys).
url.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tower.workspace = true
http-body-util.workspace = true
# Service tests seed a real in-memory DB directly (init_database_memory + the
# Sqlite*Store impls), so the raw SQL seed helpers need sqlx.
sqlx.workspace = true
