[package]
name = "openh3-cron"
version.workspace = true
edition.workspace = true


[lib]
name = "openh3_cron"

[dependencies]
openh3-common.workspace = true
openh3-db.workspace = true
openh3-api-types.workspace = true
openh3-realtime.workspace = true
openh3-conversation.workspace = true
openh3-ai-agent.workspace = true
openh3-auth.workspace = true
openh3-system.workspace = true
axum.workspace = true
cron.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
dashmap.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
sqlx.workspace = true
# Enable the `AgentInstance::Mock` variant so tests can build fake agents
# through the trait-object escape hatch without spawning real CLI processes.
openh3-ai-agent = { workspace = true, features = ["test-support"] }
