name: 🐛 Bug Report
description: Report a bug or unexpected behavior in OpenH3
title: '[Bug]: '
labels: ['bug']
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does this issue belong to?
      options:
        - Video and image workflows
        - Agent and tool execution
        - H3 or ComfyUI runtime
        - Provider and model configuration
        - Task progress and cancellation
        - Media preview and export
        - Desktop UI
        - Installation and packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenH3 Version
      description: What OpenH3 version or commit are you using?
      placeholder: e.g., 2.2.2-alpha or commit SHA
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Screenshots, error logs, etc.
