name: ❓ Question
description: Ask a question about OpenH3
title: '[Question]: '
labels: ['question']
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does this question belong to?
      options:
        - Installation and first task
        - Provider and model configuration
        - H3 or ComfyUI runtime
        - Video and image workflows
        - Agent tools
        - Task progress and results
        - Development
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
      placeholder: Ask your question here...
    validations:
      required: true

  - type: dropdown
    id: question_category
    attributes:
      label: Question Category
      description: What type of question is this?
      options:
        - Installation and setup
        - Configuration
        - Usage and features
        - Troubleshooting
        - Development
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide context about your question. What are you trying to achieve?
      placeholder: Describe what you're trying to do or understand...

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - Not applicable
