name: Discussion Triage

on:
  discussion:
    types: [created]

permissions:
  discussions: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome new discussion
        uses: actions/github-script@v7
        with:
          script: |
            const discussion = context.payload.discussion;
            if (discussion.category?.slug === 'announcements') return;
            await github.graphql(
              `mutation($discussionId: ID!, $body: String!) {
                addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                  comment { id }
                }
              }`,
              {
                discussionId: discussion.node_id,
                body: 'Thanks for starting a discussion about OpenH3. Please include your platform, OpenH3 version or commit, and the smallest reproducible example when asking for help. / 感谢参与 OpenH3 讨论；反馈问题时请附上系统、版本或 commit，以及最小复现步骤。',
              }
            );
