name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/triage-map.json
          sparse-checkout-cone-mode: false

      - name: Label issue by module
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const map = JSON.parse(fs.readFileSync('.github/triage-map.json', 'utf8'));
            const issue = context.payload.issue;
            const body = issue.body || '';
            const section = body.match(/^###\s*Module\s*\r?\n+([^\r\n#]+)/m);
            const selected = section ? section[1].trim() : null;
            const matched = selected ? map.modules.find((entry) => entry.module === selected) : null;
            const target = matched || map.fallback;

            core.info(`Module match: ${matched ? matched.module : '(none)'} -> ${target.label}`);
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: [target.label],
            });
