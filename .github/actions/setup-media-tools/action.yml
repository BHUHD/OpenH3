name: Setup media test tools
description: Install and verify FFmpeg and ffprobe for real media validation tests.

runs:
  using: composite
  steps:
    - name: Install FFmpeg on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
        fi

    - name: Install FFmpeg on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
          brew install ffmpeg
        fi

    - name: Install FFmpeg on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
          choco install ffmpeg --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Verify media tools
      shell: bash
      run: |
        ffmpeg -version
        ffprobe -version
